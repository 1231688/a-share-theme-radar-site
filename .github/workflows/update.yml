name: 每个交易日更新题材轮动雷达

on:
  schedule:
    # 10:17 UTC = 北京时间 18:17，工作日再经上交所交易日历复核。
    - cron: '17 10 * * 1-5'
  workflow_dispatch:
    inputs:
      asof:
        description: '可选：补跑交易日，格式 YYYYMMDD；留空则按北京时间当天'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: theme-radar-cloud-publish
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PUBLIC_URL: 'https://1231688.github.io/a-share-theme-radar-site'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装 Python 依赖
        run: python -m pip install -r requirements.txt

      - name: 恢复行情缓存
        uses: actions/cache@v4
        with:
          path: |
            work/mainline_out/.cache
            work/catchup_cache
          key: theme-radar-${{ github.run_id }}
          restore-keys: |
            theme-radar-

      - name: 核对交易日
        id: trading
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scripts/check_trade_day.py "${{ inputs.asof }}"

      - name: 拉取行情并计算题材周期
        if: steps.trading.outputs.should_run == 'true'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: >-
          python scripts/mainline_scan.py
          --asof "${{ steps.trading.outputs.asof }}"
          --out work/mainline_out
          --report

      - name: 生成动态补涨候选
        if: steps.trading.outputs.should_run == 'true'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scripts/catchup_probe.py --asof "${{ steps.trading.outputs.asof }}"

      - name: 生成网站数据
        if: steps.trading.outputs.should_run == 'true'
        run: python scripts/build_theme_site_data.py

      - name: 打包并校验静态网站
        if: steps.trading.outputs.should_run == 'true'
        run: python scripts/package_site.py

      - name: 准备 GitHub Pages 静态目录
        if: steps.trading.outputs.should_run == 'true'
        run: |
          python -c "from zipfile import ZipFile; ZipFile('site-bundle.zip').extractall('_site')"
          touch _site/.nojekyll

      - name: 配置 GitHub Pages
        if: steps.trading.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: 上传 GitHub Pages 产物
        if: steps.trading.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布到 GitHub Pages
        if: steps.trading.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 验证公网数据与静态资源
        if: steps.trading.outputs.should_run == 'true'
        run: >-
          python scripts/verify_release.py
          --url "${{ steps.deployment.outputs.page_url }}"
          --asof "${{ steps.trading.outputs.asof }}"
