name: Initialize public cloud project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压云端项目（工作流单独上传）
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path('cloud-theme-radar-upload.zip')
          if not archive.is_file():
              raise SystemExit('缺少 cloud-theme-radar-upload.zip')
          with ZipFile(archive) as bundle:
              for info in bundle.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise RuntimeError(f'不安全路径：{info.filename}')
                  if info.filename == '.github/workflows/update.yml':
                      continue
                  bundle.extract(info, '.')
          archive.unlink()
          Path('.github/workflows/bootstrap.yml').unlink(missing_ok=True)
          PY

      - name: 提交项目文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "项目文件已是最新"
            exit 0
          fi
          git commit -m "Initialize public theme radar project"
          git push
